# Release configuration for the capybari binary.
# Snapshot locally:  goreleaser release --snapshot --clean
version: 2
project_name: capybari
before:
  hooks:
    - go mod tidy
    - go test ./...
builds:
  - id: capybari
    main: ./cmd/capybari
    binary: capybari
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -buildid= -X main.version={{.Version}} -X main.commit={{.ShortCommit}}
    mod_timestamp: "{{ .CommitTimestamp }}"
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "capybari_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md, THIRD_PARTY_NOTICES.md]
checksum:
  name_template: checksums.txt
sboms:
  - artifacts: archive
signs:
  - cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args: ["sign-blob", "--yes", "--output-signature=${signature}", "--output-certificate=${certificate}", "${artifact}"]
    artifacts: checksum
dockers:
  - image_templates: ["ghcr.io/capybari-repo/capybari:{{ .Version }}-amd64"]
    use: buildx
    dockerfile: Dockerfile.release
    build_flag_templates: ["--platform=linux/amd64"]
  - image_templates: ["ghcr.io/capybari-repo/capybari:{{ .Version }}-arm64"]
    use: buildx
    goarch: arm64
    dockerfile: Dockerfile.release
    build_flag_templates: ["--platform=linux/arm64"]
docker_manifests:
  - name_template: ghcr.io/capybari-repo/capybari:{{ .Version }}
    image_templates: ["ghcr.io/capybari-repo/capybari:{{ .Version }}-amd64", "ghcr.io/capybari-repo/capybari:{{ .Version }}-arm64"]
  - name_template: ghcr.io/capybari-repo/capybari:latest
    image_templates: ["ghcr.io/capybari-repo/capybari:{{ .Version }}-amd64", "ghcr.io/capybari-repo/capybari:{{ .Version }}-arm64"]
brews:
  - name: capybari
    repository: { owner: capybari-repo, name: homebrew-tap }
    homepage: https://github.com/capybari-repo/capybari-cli
    description: "Capybari Source Intelligence: a free technical X-ray of your software"
    license: Apache-2.0
    test: system "#{bin}/capybari version"
release:
  github: { owner: capybari-repo, name: capybari-cli }
  footer: |
    Verify: `sha256sum -c checksums.txt` and `cosign verify-blob` with the attached certificate.
